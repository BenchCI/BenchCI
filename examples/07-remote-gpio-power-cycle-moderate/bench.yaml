version: "1"

bench:
  name: "gpio-power-cycle-bench"
  description: "Power example: DUT power is controlled through a bench-level gpio_power resource. Replace chip, GPIO line, and UART port for your Raspberry Pi / Linux agent setup."

defaults:
  node: dut
  timeouts:
    within_ms: 2000

artifacts:
  root_dir: "benchci-results"
  per_node_dirs: true

resources:
  dut_power:
    kind: power_controller
    driver:
      type: gpio_power
      chip: "/dev/gpiochip0"
      outlets:
        main: 5
      active_high: true
      initial_state: false
      on_settle_ms: 1000
      off_settle_ms: 500

nodes:
  dut:
    kind: device
    role: primary
    tags: ["gpio-power", "uart", "power-cycle"]
    transports:
      console:
        backend: uart
        port: "/dev/ttyUSB0"
        baud: 115200
        timeout_ms: 100
    gpio:
      fault_n:
        backend: local_gpio
        chip: "/dev/gpiochip0"
        line: 6
        direction: input
        active_high: false
        bias: pull_up
      heartbeat:
        backend: local_gpio
        chip: "/dev/gpiochip0"
        line: 7
        direction: input
        active_high: true
        bias: pull_down
        edge: both
